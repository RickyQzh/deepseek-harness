[package]
name = "dsh-acp"
version = "0.1.0"
description = "ACP stdio adapter for the DeepSeek Harness Rust host"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
dsh-agent = { path = "../dsh-agent" }
dsh-boot = { path = "../dsh-boot" }
dsh-kernel = { path = "../dsh-kernel" }
dsh-session = { path = "../dsh-session" }
dsh-session-persist = { path = "../dsh-session-persist" }
dsh-user-approval = { path = "../dsh-user-approval" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dsh-llm = { path = "../dsh-llm" }
dsh-system-prompt = { path = "../dsh-system-prompt" }
dsh-tools = { path = "../dsh-tools" }

[lints]
workspace = true
