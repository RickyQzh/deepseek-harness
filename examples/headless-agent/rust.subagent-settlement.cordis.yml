# Keyless continuable settlement composition for the Rust headless bin. Static names only. No JavaScript tags.
# Omits the TypeScript subagent-settlement-fence plugin. Rust replay is one shared FIFO, so spawn
# joins until settlement is queued (`enableRunInBackground: false`). Chunk interleave may differ from
# Node; the driver skips stream-json equality and asserts `source.kind === "subagent-settled"`.
- name: '@deepseek-ai/dsh-credentials'
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-llm-replay'
  config:
    providers:
      - id: deepseek-official
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: You are a headless test agent.
    includeRuntimeContext: false
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-fs-local'
- name: '@deepseek-ai/dsh-shell-bash-local'
- name: '@deepseek-ai/dsh-tool-fs'
- name: '@deepseek-ai/dsh-tool-bash'
- name: headless-auto-approve
- name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
- name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }
- name: '@deepseek-ai/dsh-token-meter'
- name: '@deepseek-ai/dsh-compaction-basic'
- name: '@deepseek-ai/dsh-llm-retry'
- name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- name: '@deepseek-ai/dsh-skill'
- name: '@deepseek-ai/dsh-skill-filesystem'
- name: '@deepseek-ai/dsh-tool-skill'
- name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official
- name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
- name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
- name: '@deepseek-ai/dsh-jobs-local'
- name: '@deepseek-ai/dsh-tool-jobs'
- name: '@deepseek-ai/dsh-subagent'
- name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
- name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    enableRunInBackground: false
- name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
- name: '@deepseek-ai/dsh-tool-subagent-control'
- name: '@deepseek-ai/dsh-tool-subagent-list'
- name: '@deepseek-ai/dsh-tool-subagent-report'
- name: headless-startup
- name: headless-runner
